<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NullVault</title>
<meta name="description" content="A private distribution vault for PWA and TWA applications.">
<meta name="theme-color" content="#0A0E12">

<!-- ============================================================
     PWA MANIFEST + ICONS
     Real same-origin files that ship alongside index.html:
       manifest.json          — web app manifest
       icons/icon-*.png       — standard PWA icon sizes
       icons/icon-maskable-*.png — Android adaptive/maskable icons
       icons/apple-touch-icon.png, favicon-32.png, favicon-16.png
     Browsers are more consistent about installability with a real
     same-origin manifest file than a data: URI, so unlike the
     service worker discussion below, there's no reason to inline
     this — it's shipped as a plain file from the start.
     ============================================================ -->
<link rel="manifest" href="./manifest.json">

<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ==================================================================
   NullVault — DESIGN SYSTEM
   Token system: vault-terminal aesthetic. Sharp edges, phosphor glow
   accents instead of soft drop shadows, monospace for structure,
   humanist sans for reading. No border-radius > 4px anywhere except
   the icon tiles and avatar circles.
   ================================================================== */

:root{
  /* --- Color --- */
  --bg:            #0A0E12;
  --bg-raised:     #10161C;
  --bg-panel:      #141B22;
  --bg-hover:      #1A232B;
  --border:        #232E38;
  --border-bright: #34424F;

  --text:          #E8ECEF;
  --text-dim:      #8B98A5;
  --text-faint:    #5A6772;

  --accent:        #4AFFB0;   /* PWA / primary phosphor green */
  --accent-dim:    #2A8F63;
  --accent-glow:   rgba(74,255,176,0.18);

  --violet:        #7B61FF;   /* TWA / secondary accent */
  --violet-dim:    #4B3D9E;
  --violet-glow:   rgba(123,97,255,0.18);

  --amber:         #FFB84A;   /* accent for badges/highlights */
  --amber-dim:     #8F6B2A;

  --danger:        #FF5C7A;
  --danger-glow:   rgba(255,92,122,0.15);

  /* --- Type --- */
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  /* --- Layout --- */
  --radius-sm: 3px;
  --radius-md: 4px;
  --radius-lg: 6px;
  --radius-icon: 10px;
  --header-h: 64px;
  --container: 1280px;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
html,body{ height:100%; overflow-x:hidden; overflow-anchor:none; }
body{ max-width:100vw; }
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 15% 0%, rgba(74,255,176,0.05), transparent 40%),
    radial-gradient(circle at 85% 15%, rgba(123,97,255,0.04), transparent 45%);
  background-attachment:fixed;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
}

h1,h2,h3,h4{ font-family:var(--font-mono); font-weight:700; margin:0; letter-spacing:-0.01em; color:var(--text); }
p{ margin:0; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; }
img{ max-width:100%; display:block; }

::selection{ background:var(--accent-glow); color:var(--accent); }

/* Focus visibility — accessible, on-brand: a phosphor outline, not a browser default */
:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:var(--radius-sm);
}

.container{ max-width:var(--container); margin:0 auto; padding:0 24px; }
@media (max-width:640px){ .container{ padding:0 16px; } }

.mono{ font-family:var(--font-mono); }
.visually-hidden{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}
.skip-link{
  position:absolute; left:16px; top:-48px; z-index:1000;
  background:var(--accent); color:var(--bg); padding:10px 16px;
  font-family:var(--font-mono); font-weight:700; font-size:13px;
  border-radius:var(--radius-md); transition:top .15s ease;
}
.skip-link:focus{ top:16px; }

/* ---------- Eyebrow / status LED pattern (signature detail) ---------- */
.led{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  box-shadow:0 0 6px currentColor;
}
.led.pwa{ background:var(--accent); color:var(--accent); }
.led.twa{ background:var(--violet); color:var(--violet); }

.eyebrow{
  font-family:var(--font-mono); font-size:11px; font-weight:600;
  letter-spacing:0.14em; text-transform:uppercase; color:var(--text-faint);
  display:flex; align-items:center; gap:8px;
}

/* ---------- Header ---------- */
.site-header{
  position:sticky; top:0; z-index:100;
  height:var(--header-h);
  background:rgba(10,14,18,0.85);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.site-header .container{
  height:100%; display:flex; align-items:center; gap:24px;
}
.brand{
  display:flex; align-items:center; gap:10px;
  font-family:var(--font-mono); font-weight:800; font-size:16px;
  letter-spacing:0.02em; color:var(--text); flex-shrink:0;
  white-space:nowrap;
}
.brand-mark{
  width:28px; height:28px; flex-shrink:0;
}
.brand small{
  display:block; font-size:9px; font-weight:600; color:var(--accent);
  letter-spacing:0.16em; margin-top:1px;
}

.main-nav{
  display:flex; align-items:center; gap:4px; margin-left:8px;
}
.main-nav a{
  font-family:var(--font-mono); font-size:13px; font-weight:500;
  color:var(--text-dim); padding:8px 12px; border-radius:var(--radius-md);
  transition:color .15s, background .15s;
}
.main-nav a:hover{ color:var(--text); background:var(--bg-hover); }
.main-nav a.active{ color:var(--accent); }

.header-spacer{ flex:1 1 auto; }

/* ----------------------------------------------------------------------
   Search bar — disabled for now (catalog is small enough that browsing
   the Apps page covers it). The .search-wrap rules are kept here,
   commented out, so re-enabling later is just uncommenting these plus
   restoring the <form class="search-wrap"> markup in renderHeader().
----------------------------------------------------------------------
.search-wrap{
  position:relative; flex:1 1 auto; max-width:360px; min-width:160px;
}
.search-wrap input{
  width:100%; background:var(--bg-panel); border:1px solid var(--border);
  color:var(--text); font-family:var(--font-sans); font-size:13.5px;
  padding:9px 12px 9px 34px; border-radius:var(--radius-md);
  transition:border-color .15s, background .15s;
}
.search-wrap input::placeholder{ color:var(--text-faint); }
.search-wrap input:hover{ border-color:var(--border-bright); }
.search-wrap input:focus{ outline:none; border-color:var(--accent); background:var(--bg-raised); }
.search-wrap svg{
  position:absolute; left:11px; top:50%; transform:translateY(-50%);
  width:14px; height:14px; color:var(--text-faint); pointer-events:none;
}
---------------------------------------------------------------------- */

.header-actions{ display:flex; align-items:center; gap:10px; flex-shrink:0; margin-left:16px; }

.btn{
  font-family:var(--font-mono); font-size:13px; font-weight:600;
  padding:9px 16px; border-radius:var(--radius-md); border:1px solid transparent;
  cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  transition:transform .1s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.btn:active{ transform:scale(0.97); }
.btn-primary{
  background:var(--accent); color:var(--bg); border-color:var(--accent);
}
.btn-primary:hover{ box-shadow:0 0 0 3px var(--accent-glow); }
.btn-secondary{
  background:transparent; color:var(--text); border-color:var(--border-bright);
}
.btn-secondary:hover{ background:var(--bg-hover); border-color:var(--accent-dim); }
.btn-violet{ background:var(--violet); color:#fff; border-color:var(--violet); }
.btn-violet:hover{ box-shadow:0 0 0 3px var(--violet-glow); }
.btn-ghost{
  background:transparent; color:var(--text-dim); border-color:transparent;
}
.btn-ghost:hover{ color:var(--text); background:var(--bg-hover); }
.btn-block{ width:100%; justify-content:center; }
.btn-lg{ padding:13px 22px; font-size:14px; }
.btn[disabled]{ opacity:0.45; cursor:not-allowed; }
.btn svg{ width:15px; height:15px; flex-shrink:0; }

/* ---------- Download-progress button (APK download) ---------- */
.btn-progress{
  position:relative; overflow:hidden; isolation:isolate;
}
.btn-progress-fill{
  position:absolute; inset:0; width:0%; z-index:0;
  background:rgba(255,255,255,0.22);
  transition:width .18s ease;
}
.btn-progress-label{
  position:relative; z-index:1; display:inline-flex; align-items:center; gap:8px;
}
.btn-progress[data-state="downloading"]{ cursor:progress; }
.btn-progress[data-state="downloading"] .btn-progress-label{ opacity:0.95; }
.btn-progress[data-state="ready"]{ background:var(--accent); border-color:var(--accent); color:var(--bg); }
.btn-progress[data-state="ready"]:hover{ box-shadow:0 0 0 3px var(--accent-glow); }
.btn-progress[data-state="error"]{ background:var(--danger); border-color:var(--danger); color:#fff; }

.mobile-menu-btn{ display:none; background:transparent; border:0; color:var(--text); padding:8px; cursor:pointer; }
.mobile-menu-btn svg{ width:22px; height:22px; }

/* Mobile nav drawer */
.mobile-drawer{
  display:none; position:fixed; inset:0; z-index:200;
}
.mobile-drawer.open{ display:block; }
.mobile-drawer-scrim{
  position:absolute; inset:0; background:rgba(0,0,0,0.6);
}
.mobile-drawer-panel{
  position:absolute; top:0; right:0; bottom:0; width:min(78vw,320px);
  background:var(--bg-raised); border-left:1px solid var(--border);
  padding:20px; display:flex; flex-direction:column; gap:4px;
  animation:slideIn .18s ease;
}
@keyframes slideIn{ from{ transform:translateX(100%); } to{ transform:translateX(0); } }
.mobile-drawer-panel a{
  font-family:var(--font-mono); font-size:15px; padding:14px 10px;
  border-bottom:1px solid var(--border); color:var(--text);
}
.mobile-drawer-close{
  align-self:flex-end; background:transparent; border:0; color:var(--text-dim);
  padding:8px; cursor:pointer; margin-bottom:8px;
}

@media (max-width:900px){
  .main-nav{ display:none; }
  .search-wrap{ display:none; }
  .mobile-menu-btn{ display:inline-flex; }
}
@media (max-width:640px){
  .brand span.brand-name-full{ display:none; }
}

/* ---------- Hero ---------- */
.hero{
  border-bottom:1px solid var(--border);
  padding:64px 0 56px;
  position:relative; overflow:hidden;
}
.hero::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 60% 100% at 50% 0%, black, transparent);
  opacity:0.35;
}
.hero-inner{ position:relative; max-width:720px; }
.hero h1{
  font-size:clamp(28px,4.5vw,42px); line-height:1.15; margin:14px 0 16px;
}
.hero h1 .accent-text{ color:var(--accent); }
.hero p.lead{
  font-family:var(--font-sans); color:var(--text-dim); font-size:16px;
  max-width:560px; margin-bottom:28px;
}
.hero-stats{ display:flex; gap:28px; margin-top:32px; flex-wrap:wrap; }
.hero-stat{ font-family:var(--font-mono); }
.hero-stat .n{ font-size:22px; font-weight:800; color:var(--accent); display:block; }
.hero-stat .l{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.1em; }

/* ---------- Section headers ---------- */
.section{ padding:48px 0; }
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin-bottom:22px; gap:16px; flex-wrap:wrap;
}
.section-head h2{ font-size:20px; }
.section-head .see-all{
  font-family:var(--font-mono); font-size:12.5px; color:var(--accent);
  display:flex; align-items:center; gap:4px; flex-shrink:0;
}
.section-head .see-all svg{ width:13px; height:13px; }
.section-head .see-all:hover{ text-decoration:underline; }

/* ---------- App card grid ---------- */
.app-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
}
.app-grid.rail{
  display:flex; overflow-x:auto; scroll-snap-type:x proximity;
  gap:16px; padding-bottom:8px; margin:0 -24px; padding-left:24px; padding-right:24px;
}
@media (max-width:640px){
  .app-grid.rail{ margin:0 -16px; padding-left:16px; padding-right:16px; }
}
.app-grid.rail .app-card{ min-width:250px; scroll-snap-align:start; }
.app-grid.rail::-webkit-scrollbar{ height:6px; }
.app-grid.rail::-webkit-scrollbar-thumb{ background:var(--border-bright); border-radius:3px; }

.app-card{
  background:var(--bg-panel); border:1px solid var(--border);
  border-radius:var(--radius-lg); padding:16px; cursor:pointer;
  display:flex; flex-direction:column; gap:12px;
  transition:border-color .15s ease, transform .12s ease, box-shadow .15s ease;
  position:relative; overflow:hidden;
  text-align:left;
}
.app-card::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(120deg, transparent 40%, rgba(74,255,176,0.06) 50%, transparent 60%);
  transform:translateX(-120%);
  transition:transform .5s ease;
}
.app-card:hover{
  border-color:var(--accent-dim); transform:translateY(-2px);
  box-shadow:0 8px 24px -12px rgba(0,0,0,0.5);
}
.app-card:hover::after{ transform:translateX(120%); }
.app-card:focus-visible{ border-color:var(--accent); }

.app-card-top{ display:flex; gap:12px; align-items:flex-start; }
.app-icon{
  width:56px; height:56px; border-radius:var(--radius-icon); flex-shrink:0;
  object-fit:cover; background:var(--bg-hover); border:1px solid var(--border);
}
.app-card-meta{ min-width:0; flex:1; }
.app-card-meta h3{
  font-family:var(--font-sans); font-size:15px; font-weight:700; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.app-card-dev{
  font-size:12.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; margin-top:2px;
}
.app-card-badges{ display:flex; align-items:center; gap:6px; margin-top:6px; }
.type-badge{
  font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:0.06em;
  padding:2px 6px; border-radius:var(--radius-sm); display:inline-flex; align-items:center; gap:4px;
  border:1px solid var(--border-bright);
}
.type-badge.pwa{ color:var(--accent); border-color:var(--accent-dim); }
.type-badge.twa{ color:var(--violet); border-color:var(--violet-dim); }

.app-card-desc{
  font-size:13px; color:var(--text-dim); line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  flex:1;
}
.app-card-bottom{
  display:flex; align-items:center; justify-content:space-between;
  padding-top:10px; border-top:1px solid var(--border);
}
.category-chip{
  font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);
  text-transform:uppercase; letter-spacing:0.05em;
}

.featured-card{
  grid-column:span 1;
}

/* ---------- Filter bar ---------- */
.filter-bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:14px 0; margin-bottom:8px; border-bottom:1px solid var(--border);
}
.filter-bar select{
  background:var(--bg-panel); color:var(--text); border:1px solid var(--border);
  font-family:var(--font-mono); font-size:12.5px; padding:8px 10px;
  border-radius:var(--radius-md); cursor:pointer;
}
.filter-bar select:hover{ border-color:var(--border-bright); }
.filter-bar select:focus{ outline:none; border-color:var(--accent); }
.filter-chip-group{ display:flex; gap:6px; }
.filter-chip{
  font-family:var(--font-mono); font-size:12px; font-weight:600;
  padding:7px 12px; border-radius:999px; border:1px solid var(--border);
  background:transparent; color:var(--text-dim); cursor:pointer;
  transition:all .15s ease;
}
.filter-chip:hover{ border-color:var(--border-bright); color:var(--text); }
.filter-chip.active{ background:var(--accent-glow); border-color:var(--accent); color:var(--accent); }
.filter-bar .result-count{
  margin-left:auto; font-family:var(--font-mono); font-size:12px; color:var(--text-faint);
}

/* ---------- Category tiles ---------- */
.cat-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px;
}
.cat-tile{
  background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:18px; cursor:pointer; transition:border-color .15s, transform .12s;
}
.cat-tile:hover{ border-color:var(--accent-dim); transform:translateY(-2px); }
.cat-tile .cat-icon{ font-size:22px; margin-bottom:10px; display:block; }
.cat-tile h4{ font-family:var(--font-sans); font-size:14px; font-weight:600; }
.cat-tile .cat-count{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-top:4px; }

/* ---------- Skeletons ---------- */
.skeleton{
  background:linear-gradient(90deg, var(--bg-panel) 25%, var(--bg-hover) 37%, var(--bg-panel) 63%);
  background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:var(--radius-md);
}
@keyframes shimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }
.skel-card{ height:172px; }

/* ---------- Empty / error state ---------- */
.state-block{
  text-align:center; padding:64px 20px; color:var(--text-dim);
}
.state-block .state-icon{ font-size:36px; margin-bottom:16px; opacity:0.6; }
.state-block h3{ font-family:var(--font-sans); font-size:16px; color:var(--text); margin-bottom:6px; }
.state-block p{ font-size:13.5px; max-width:360px; margin:0 auto; }

/* ---------- App detail page ---------- */
.app-detail-header{
  display:flex; gap:24px; padding:40px 0 32px; border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.app-detail-icon{
  width:120px; height:120px; border-radius:22px; flex-shrink:0;
  border:1px solid var(--border-bright); object-fit:cover; background:var(--bg-panel);
}
.app-detail-info{ flex:1; min-width:240px; }
.app-detail-info h1{ font-family:var(--font-sans); font-size:26px; margin-bottom:4px; }
.app-detail-dev{ color:var(--text-dim); font-size:14px; margin-bottom:12px; }
.app-detail-meta-row{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:16px;
}
.app-detail-actions{ display:flex; gap:10px; flex-wrap:wrap; }

.stat-strip{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:1px; background:var(--border); border:1px solid var(--border);
  border-radius:var(--radius-lg); overflow:hidden; margin:28px 0;
}
.stat-cell{ background:var(--bg-panel); padding:14px 16px; }
.stat-cell .l{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px; }
.stat-cell .v{ font-family:var(--font-sans); font-size:14px; font-weight:600; color:var(--text); }

.detail-section{ margin:32px 0; }
.detail-section h2{ font-size:15px; margin-bottom:14px; color:var(--text); }
.detail-section .body-text{ color:var(--text-dim); font-size:14.5px; line-height:1.7; white-space:pre-line; }

.screenshot-rail{
  display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; scroll-snap-type:x proximity;
}
.screenshot-rail img{
  height:340px; width:auto; aspect-ratio:9/16; border-radius:var(--radius-lg); border:1px solid var(--border);
  flex-shrink:0; scroll-snap-align:start; background:var(--bg-panel); object-fit:cover;
}
@media (max-width:640px){ .screenshot-rail img{ height:220px; } }

.feature-list{ list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
.feature-list li{
  display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--text-dim);
}
.feature-list svg{ width:15px; height:15px; color:var(--accent); flex-shrink:0; margin-top:2px; }

.platform-list{ display:flex; gap:8px; flex-wrap:wrap; }
.platform-chip{
  font-family:var(--font-mono); font-size:12px; padding:6px 12px; border-radius:999px;
  border:1px solid var(--border-bright); color:var(--text-dim);
}

/* ---------- Toasts ---------- */
.toast-stack{
  position:fixed; bottom:20px; right:20px; z-index:1000;
  display:flex; flex-direction:column; gap:10px; max-width:min(90vw,340px);
}
.toast{
  background:var(--bg-raised); border:1px solid var(--border-bright); border-left:3px solid var(--accent);
  border-radius:var(--radius-md); padding:12px 14px; font-size:13px; color:var(--text);
  box-shadow:0 10px 30px -10px rgba(0,0,0,0.6);
  animation:toastIn .2s ease;
  display:flex; align-items:flex-start; gap:10px;
}
.toast.error{ border-left-color:var(--danger); }
.toast.info{ border-left-color:var(--violet); }
@keyframes toastIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
.toast button{ background:transparent; border:0; color:var(--text-faint); cursor:pointer; margin-left:auto; padding:0; line-height:1; flex-shrink:0; }

/* ---------- Modal ---------- */
.modal-scrim{
  position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:300;
  display:flex; align-items:center; justify-content:center; padding:20px;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.modal-box{
  background:var(--bg-raised); border:1px solid var(--border-bright); border-radius:var(--radius-lg);
  max-width:420px; width:100%; padding:26px; animation:modalIn .18s ease;
}
@keyframes modalIn{ from{ opacity:0; transform:scale(0.96) translateY(8px); } to{ opacity:1; transform:scale(1) translateY(0); } }
.modal-box h3{ font-size:17px; margin-bottom:10px; font-family:var(--font-sans); }
.modal-box p{ color:var(--text-dim); font-size:13.5px; margin-bottom:20px; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; }

/* ---------- Forms ---------- */
.form-group{ margin-bottom:16px; }
.form-group label{
  display:block; font-family:var(--font-mono); font-size:12px; color:var(--text-dim);
  margin-bottom:6px; text-transform:uppercase; letter-spacing:0.05em;
}
.form-group input, .form-group textarea{
  width:100%; background:var(--bg-panel); border:1px solid var(--border);
  color:var(--text); font-family:var(--font-sans); font-size:14px;
  padding:11px 13px; border-radius:var(--radius-md); transition:border-color .15s;
}
.form-group input:hover, .form-group textarea:hover{ border-color:var(--border-bright); }
.form-group input:focus, .form-group textarea:focus{ outline:none; border-color:var(--accent); }
.form-group textarea{ resize:vertical; min-height:120px; }
.form-error{ color:var(--danger); font-size:12px; margin-top:6px; font-family:var(--font-mono); }
.form-group.has-error input, .form-group.has-error textarea{ border-color:var(--danger); }
.form-success-box{
  background:var(--accent-glow); border:1px solid var(--accent-dim); border-radius:var(--radius-lg);
  padding:24px; text-align:center;
}
.form-success-box svg{ width:32px; height:32px; color:var(--accent); margin-bottom:10px; }

/* ---------- Install banner (beforeinstallprompt for the store PWA itself) ---------- */
.install-banner{
  display:none; align-items:center; gap:12px; background:var(--bg-panel);
  border:1px solid var(--accent-dim); border-radius:var(--radius-lg);
  padding:12px 16px; margin:16px 0;
}
.install-banner.show{ display:flex; }
.install-banner p{ flex:1; font-size:13px; color:var(--text-dim); }
.install-banner .close-install{ background:transparent; border:0; color:var(--text-faint); cursor:pointer; }

/* ---------- Footer ---------- */
.site-footer{
  border-top:1px solid var(--border); padding:40px 0 32px; margin-top:60px;
}
.footer-grid{ display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap; }
.footer-brand{ font-family:var(--font-mono); font-weight:700; font-size:14px; margin-bottom:8px; }
.footer-tag{ color:var(--text-faint); font-size:12.5px; max-width:280px; }
.footer-links{ display:flex; gap:28px; flex-wrap:wrap; }
.footer-col h5{ font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); margin-bottom:12px; }
.footer-col a{ display:block; font-size:13px; color:var(--text-dim); padding:4px 0; }
.footer-col a:hover{ color:var(--accent); }
.footer-bottom{ margin-top:32px; padding-top:20px; border-top:1px solid var(--border); font-size:12px; color:var(--text-faint); font-family:var(--font-mono); }

/* ---------- Utility: page transition ---------- */
.page-enter{ animation:pageIn .22s ease; }
@keyframes pageIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

/* ---------- Back link ---------- */
.back-link{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono);
  font-size:12.5px; color:var(--text-dim); margin:20px 0 0; padding:6px 0;
  background:transparent; border:0; cursor:pointer; text-align:left;
  -webkit-appearance:none; appearance:none;
}
.back-link:hover{ color:var(--accent); }
.back-link:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-sm); }
.back-link svg{ width:14px; height:14px; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<div id="app-root"></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script type="module">
/* ====================================================================
   ██╗   ██╗ █████╗ ██╗   ██╗██╗  ████████╗
   ██║   ██║██╔══██╗██║   ██║██║  ╚══██╔══╝
   ██║   ██║███████║██║   ██║██║     ██║
   ╚██╗ ██╔╝██╔══██║██║   ██║██║     ██║
    ╚████╔╝ ██║  ██║╚██████╔╝███████╗██║
     ╚═══╝  ╚═╝  ╚═╝ ╚═════╝ ╚══════╝╚═╝

   =====================  CONFIGURATION  =============================
   NullVault reads its configuration from two plain JSON files that sit
   next to index.html, so you can edit the store WITHOUT touching any
   code:

     settings.json   -> store branding, contact endpoint
     app-list.json   -> the entire app catalog (add/remove apps here)

   Both are loaded by loadConfiguration() below, at boot, over fetch().
   If either file is missing or fails to load (for example if you open
   index.html directly via file:// without a local server, where fetch
   of local files is blocked by the browser), NullVault falls back to
   the small built-in defaults defined right here, so the app never
   breaks — it just won't reflect your edits until served over http(s).
   ==================================================================== */

// Fallback used only if settings.json can't be fetched.
let STORE_CONFIG = {
  name: "NullVault",
  tagline: "Private distribution for PWA & TWA builds",
  logoInitial: "V",
  contactEndpoint: null,
  contactEndpointExtraFields: {},
};

// Fallback used only if app-list.json can't be fetched — kept small on
// purpose since the real catalog now lives in app-list.json.
let APP_CATALOG = [
  {
    id: "stage-whisper",
    name: "Stage Whisper",
    icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23161b22'/%3E%3Cpath d='M30 65 Q30 30 50 30 Q70 30 70 65' fill='none' stroke='%234AFFB0' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='30' r='7' fill='%234AFFB0'/%3E%3Cline x1='30' y1='65' x2='30' y2='75' stroke='%234AFFB0' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='70' y1='65' x2='70' y2='75' stroke='%234AFFB0' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E",
    developer: "NullVault",
    shortDescription: "Practice your lines with AI-powered scene partners and on-demand hints.",
    fullDescription: "Stage Whisper turns your phone into a rehearsal partner. Load a script, assign roles, and run scenes with natural-sounding AI voices reading opposite you. On-demand hints surface your next line only when you ask for it, scene transition banners keep you oriented in long rehearsals, and everything syncs across devices so you can pick up backstage exactly where you left off at home.",
    version: "2.4.1",
    category: "Productivity",
    tags: ["theatre", "acting", "scripts", "rehearsal", "voice"],
    screenshots: [
      "https://images.unsplash.com/photo-1503095396549-807759245b35?w=800&q=80",
      "https://images.unsplash.com/photo-1524712245354-2c4e5e7121c0?w=800&q=80",
      "https://images.unsplash.com/photo-1516307365426-bea591f05011?w=800&q=80",
    ],
    downloadUrl: "https://stagewhisper.nullvault.eu",
    type: "PWA",
    appUrl: "https://stagewhisper.nullvault.eu",
    rating: 4.8,
    ratingCount: 214,
    releaseDate: "2025-02-11",
    lastUpdated: "2026-08-02",
    platforms: ["Web", "Android", "iOS", "Desktop"],
    features: [
      "Multi-provider AI voices (Google AI Studio + more)",
      "On-demand line hints, not spoiler overlays",
      "Scene transition banners for long scripts",
      "Offline rehearsal mode",
      "Cross-device sync with conflict resolution",
    ],
    featured: true,
  },
];

/* ====================================================================
   CONFIGURATION LOADER
   Fetches settings.json and app-list.json and merges them over the
   built-in fallback defaults above. Called once at boot, before the
   first render(), so the page always shows real content on the first
   paint — never a loading spinner for the whole app shell.
   ==================================================================== */
async function loadConfiguration(){
  await Promise.all([loadSettings(), loadAppList()]);
}

async function loadSettings(){
  try{
    const res = await fetch("./settings.json", { cache: "no-cache" });
    if(!res.ok) throw new Error(`settings.json responded ${res.status}`);
    const settings = await res.json();

    if(settings.store){
      STORE_CONFIG = {
        name: settings.store.name ?? STORE_CONFIG.name,
        tagline: settings.store.tagline ?? STORE_CONFIG.tagline,
        logoInitial: settings.store.logoInitial ?? STORE_CONFIG.logoInitial,
        contactEndpoint: settings.contact?.endpoint ?? null,
        contactEndpointExtraFields: settings.contact?.extraFields
          ? Object.fromEntries(Object.entries(settings.contact.extraFields).filter(([k]) => k !== "_comment" && settings.contact.extraFields[k]))
          : {},
      };
    }
  } catch(e){
    // settings.json missing, malformed, or unreachable (e.g. opened via
    // file:// where fetch of local files is blocked). Built-in defaults
    // defined earlier in this file remain in effect.
    console.warn("[VAULT] Could not load settings.json, using built-in defaults:", e.message);
  }
}

async function loadAppList(){
  try{
    const res = await fetch("./app-list.json", { cache: "no-cache" });
    if(!res.ok) throw new Error(`app-list.json responded ${res.status}`);
    const apps = await res.json();
    if(Array.isArray(apps) && apps.length > 0){
      APP_CATALOG = apps;
    }
  } catch(e){
    console.warn("[VAULT] Could not load app-list.json, using built-in fallback catalog:", e.message);
  }
}

/* ====================================================================
   GLOBAL STATE
   ==================================================================== */
const state = {
  route: { name: "home", params: {} },
  search: "",
  filters: { category: "all", type: "all" },
  sort: "featured",
  deferredInstallPrompt: null,
  mobileNavOpen: false,
};

/* ====================================================================
   ICONS (inline SVG strings — no icon library dependency)
   ==================================================================== */
const ICON = {
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  arrowRight: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`,
  chevronLeft: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>`,
  menu: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>`,
  close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  external: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>`,
  checkCircle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
  vault: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="3" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="3" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="21" y2="12"/></svg>`,
  info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
};
function icon(name, cls=""){ return `<span class="icon ${cls}" style="display:inline-flex">${ICON[name]||""}</span>`; }

/* ====================================================================
   UTILITIES
   ==================================================================== */
function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatDate(iso){
  try{
    return new Date(iso + "T00:00:00").toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
  } catch { return iso; }
}
// The catalog data still uses "PWA"/"TWA" internally (matches app-list.json
// and keeps filter/sort logic simple), but most people don't know those
// acronyms. This maps the data value to the plain-language label shown
// anywhere in the UI. Change the labels here if you'd like different
// wording — nothing else needs to change.
function typeLabel(type){
  return type === "PWA" ? "Web" : type === "TWA" ? "APK" : type;
}
function debounce(fn, ms){
  let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
function showToast(message, type="success", timeout=4200){
  const stack = document.getElementById("toast-stack");
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const iconName = type === "error" ? "info" : type === "info" ? "info" : "checkCircle";
  el.innerHTML = `${icon(iconName)}<span>${escapeHtml(message)}</span><button aria-label="Dismiss">${ICON.close}</button>`;
  el.querySelector("button").addEventListener("click", () => el.remove());
  stack.appendChild(el);
  setTimeout(() => el.remove(), timeout);
}
function categories(){
  const set = new Map();
  APP_CATALOG.forEach(a => set.set(a.category, (set.get(a.category)||0)+1));
  return [...set.entries()].map(([name,count]) => ({name,count}));
}
const CATEGORY_ICONS = {
  "Productivity": "🗂", "Finance": "📊", "Graphics & Design": "🎨", "Utilities": "🛠",
};

/* ====================================================================
   ROUTER
   Hash-based client-side routing. No framework, no reload.
   Routes: #/  #/apps  #/categories  #/app/{id}  #/contact
   ==================================================================== */
function parseHash(){
  const hash = location.hash.replace(/^#\/?/, "");
  const [path, queryStr] = hash.split("?");
  const parts = path.split("/").filter(Boolean);
  const query = new URLSearchParams(queryStr || "");

  if(parts.length === 0) return { name:"home", params:{}, query };
  if(parts[0] === "apps") return { name:"apps", params:{}, query };
  if(parts[0] === "categories" && !parts[1]) return { name:"categories", params:{}, query };
  if(parts[0] === "categories" && parts[1]) return { name:"apps", params:{}, query: new URLSearchParams([...query, ["category", decodeURIComponent(parts[1])]]) };
  if(parts[0] === "app" && parts[1]) return { name:"app-detail", params:{ id: decodeURIComponent(parts[1]) }, query };
  if(parts[0] === "contact") return { name:"contact", params:{}, query };
  return { name:"not-found", params:{}, query };
}
function navigate(path){
  if(location.hash === "#" + path) {
    render();
    requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo({ top: 0, left: 0 })));
    return;
  }
  location.hash = path;
}
window.addEventListener("hashchange", () => {
  state.route = parseHash();
  render();
  // Deferred to the next frame: setting location.hash triggers the
  // browser's own native scroll behavior for same-document navigation
  // (it treats the fragment like a same-page anchor jump), which can
  // run after this handler and override an immediate scrollTo(0) call,
  // especially when the page was scrolled down before navigating. Two
  // rAFs (one to let layout settle after the DOM swap, one to run after
  // any native scroll adjustment) makes the reset reliably win.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => window.scrollTo({ top: 0, left: 0 }));
  });
});

/* ====================================================================
   FILTER / SEARCH / SORT
   ==================================================================== */
function matchesSearch(app, q){
  if(!q) return true;
  const hay = [app.name, app.developer, app.category, app.shortDescription, typeLabel(app.type), ...(app.tags||[])].join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}
function getFilteredApps(){
  const { search, filters, sort } = state;
  let list = APP_CATALOG.filter(app => {
    if(!matchesSearch(app, search)) return false;
    if(filters.category !== "all" && app.category !== filters.category) return false;
    if(filters.type !== "all" && app.type !== filters.type) return false;
    return true;
  });
  switch(sort){
    case "newest": list.sort((a,b) => new Date(b.releaseDate) - new Date(a.releaseDate)); break;
    case "name": list.sort((a,b) => a.name.localeCompare(b.name)); break;
    case "featured":
    default: list.sort((a,b) => (b.featured?1:0) - (a.featured?1:0)); break;
  }
  return list;
}

/* ====================================================================
   RENDER ENGINE
   Each page render function returns an HTML string. render() swaps
   #app-root's content and re-binds event listeners for that page only
   — no virtual DOM, but scoped enough to stay maintainable in one file.
   ==================================================================== */
const root = document.getElementById("app-root");

function layout(pageHtml){
  return `
    ${renderHeader()}
    <main id="main" class="page-enter">${pageHtml}</main>
    ${renderFooter()}
    ${renderMobileDrawer()}
  `;
}

function renderHeader(){
  const r = state.route.name;
  const navLink = (path, label, routeName) =>
    `<a href="#${path}" class="${r===routeName ? "active" : ""}">${label}</a>`;

  return `
  <header class="site-header">
    <div class="container">
      <a href="#/" class="brand">
        <svg class="brand-mark" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#0A0E12" stroke="#232E38"/><path d="M50 20 L75 35 L75 65 L50 80 L25 65 L25 35 Z" fill="none" stroke="#4AFFB0" stroke-width="4"/><circle cx="50" cy="50" r="10" fill="#4AFFB0"/></svg>
        <span>
          <span class="brand-name-full">${escapeHtml(STORE_CONFIG.name)}</span>
          <small>NullVault</small>
        </span>
      </a>
      <nav class="main-nav" aria-label="Primary">
        ${navLink("/", "Home", "home")}
        ${navLink("/apps", "Apps", "apps")}
        ${navLink("/categories", "Categories", "categories")}
        ${navLink("/contact", "Contact", "contact")}
      </nav>
      <div class="header-spacer"></div>
      <div class="header-actions">
        <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Open menu">${ICON.menu}</button>
      </div>
    </div>
  </header>`;
}

function renderMobileDrawer(){
  const r = state.route.name;
  return `
  <div class="mobile-drawer ${state.mobileNavOpen ? "open":""}" id="mobile-drawer">
    <div class="mobile-drawer-scrim" id="mobile-drawer-scrim"></div>
    <div class="mobile-drawer-panel">
      <button class="mobile-drawer-close" id="mobile-drawer-close" aria-label="Close menu">${ICON.close}</button>
      <a href="#/" class="${r==="home"?"active":""}" style="color:${r==="home"?"var(--accent)":""}">Home</a>
      <a href="#/apps" class="${r==="apps"?"active":""}" style="color:${r==="apps"?"var(--accent)":""}">Apps</a>
      <a href="#/categories" class="${r==="categories"?"active":""}" style="color:${r==="categories"?"var(--accent)":""}">Categories</a>
      <a href="#/contact" class="${r==="contact"?"active":""}" style="color:${r==="contact"?"var(--accent)":""}">Contact</a>
    </div>
  </div>`;
}

function renderFooter(){
  return `
  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <div class="footer-brand mono">${escapeHtml(STORE_CONFIG.name)}</div>
          <p class="footer-tag">${escapeHtml(STORE_CONFIG.tagline)}.</p>
        </div>
        <div class="footer-links">
          <div class="footer-col">
            <h5>Browse</h5>
            <a href="#/apps">All apps</a>
            <a href="#/categories">Categories</a>
            <a href="#/contact">Contact</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">© ${new Date().getFullYear()} ${escapeHtml(STORE_CONFIG.name)}. All listed applications remain property of their respective developers.</div>
    </div>
  </footer>`;
}

/* ---------- App card ---------- */
function appCard(app){
  return `
  <button class="app-card" data-nav="/app/${encodeURIComponent(app.id)}" aria-label="View ${escapeHtml(app.name)}">
    <div class="app-card-top">
      <img class="app-icon" src="${app.icon}" alt="" loading="lazy">
      <div class="app-card-meta">
        <h3>${escapeHtml(app.name)}</h3>
        <div class="app-card-dev">${escapeHtml(app.developer)}</div>
        <div class="app-card-badges">
          <span class="type-badge ${app.type.toLowerCase()}"><span class="led ${app.type.toLowerCase()}"></span>${typeLabel(app.type)}</span>

      </div>
    </div>
    <p class="app-card-desc">${escapeHtml(app.shortDescription)}</p>
    <div class="app-card-bottom">
      <span class="category-chip">${escapeHtml(app.category)}</span>
      <span class="type-badge ${app.type.toLowerCase()}" style="margin-left:auto;"><span class="led ${app.type.toLowerCase()}"></span>${typeLabel(app.type)}</span>
    </div>
  </button>`;

/* ---------- Contact form validation + submission ---------- */
function validateContactForm(data){
  const errors = {};
  if(!data.name.trim()) errors.name = "Name is required.";
  if(!data.email.trim()) errors.email = "Email is required.";
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email.trim())) errors.email = "Enter a valid email address.";
  if(!data.subject.trim()) errors.subject = "Subject is required.";
  if(!data.message.trim()) errors.message = "Message is required.";
  else if(data.message.trim().length < 10) errors.message = "Message should be at least 10 characters.";
  return errors;
}
async function submitContactForm(data){
  // ----------------------------------------------------------------
  // If STORE_CONFIG.contactEndpoint is set, this posts there (works
  // as-is for Formspree / Web3Forms style endpoints). Otherwise it
  // simulates a network round trip so the UI states are demonstrable
  // without a backend configured yet.
  // ----------------------------------------------------------------
  if(!STORE_CONFIG.contactEndpoint){
    await new Promise(res => setTimeout(res, 900));
    return { ok: true, simulated: true };
  }
  const res = await fetch(STORE_CONFIG.contactEndpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({ ...data, ...STORE_CONFIG.contactEndpointExtraFields }),
  });
  if(!res.ok) throw new Error(`Server responded ${res.status}`);
  return { ok: true, simulated: false };
}

   MASTER RENDER + EVENT BINDING
   ==================================================================== */
function render(){
  const r = state.route;
  let pageHtml = "";
  switch(r.name){
    case "home": pageHtml = pageHome(); break;
    case "apps": {
      // support ?category=X coming from /categories/{name} redirects
      const cat = r.query.get("category");
      if(cat) state.filters.category = cat;
      pageHtml = pageApps();
      break;
    }
    case "categories": pageHtml = pageCategories(); break;
    case "app-detail": pageHtml = pageAppDetail(r.params.id); break;
    case "contact": pageHtml = pageContact(); break;
    default: pageHtml = `<div class="container">${emptyState("Page not found", "That route doesn't exist.", "info")}<div style="text-align:center;"><button class="btn btn-secondary" data-nav="/">Go home</button></div></div>`;
  }
  root.innerHTML = layout(pageHtml);
  bindGlobalEvents();
  bindPageEvents(r);
  updateInstallBannerVisibility();
}

function bindGlobalEvents(){
  // Generic [data-nav] click delegation — covers cards, buttons, category tiles
  root.querySelectorAll("[data-nav]").forEach(el => {
    el.addEventListener("click", () => navigate(el.getAttribute("data-nav")));
  });

  // Header search — currently disabled (see the commented-out .search-wrap
  // CSS above and the removed <form> in renderHeader()). This binding is
  // left in place and no-ops safely via the `if(searchInput)` guard below,
  // so re-enabling search later needs no JS changes.
  const searchForm = document.getElementById("header-search-form");
  const searchInput = document.getElementById("header-search-input");
  if(searchInput){
    const debounced = debounce((val) => {
      state.search = val;
      if(state.route.name !== "apps") navigate("/apps");
      else render();
    }, 220);
    searchInput.addEventListener("input", (e) => debounced(e.target.value));
    searchForm.addEventListener("submit", (e) => { e.preventDefault(); state.search = searchInput.value; if(state.route.name!=="apps") navigate("/apps"); else render(); });
  }

  // Mobile menu
  document.getElementById("mobile-menu-toggle")?.addEventListener("click", () => { state.mobileNavOpen = true; render(); });
  document.getElementById("mobile-drawer-close")?.addEventListener("click", () => { state.mobileNavOpen = false; render(); });
  document.getElementById("mobile-drawer-scrim")?.addEventListener("click", () => { state.mobileNavOpen = false; render(); });
  document.querySelectorAll(".mobile-drawer-panel a").forEach(a => a.addEventListener("click", () => { state.mobileNavOpen = false; }));
}

function bindPageEvents(route){

function bindAppDetailEvents(appId){
  const app = APP_CATALOG.find(a => a.id === appId);
  if(!app) return;

  // --- PWA install handling ---
  if(app.type === "PWA"){
    const installBtn = document.getElementById("pwa-install-btn");
    const openBtn = document.getElementById("pwa-open-btn");
    const statusMsg = document.getElementById("install-status-msg");

    openBtn?.addEventListener("click", () => window.open(app.appUrl, "_blank", "noopener,noreferrer"));

    installBtn?.addEventListener("click", async () => {
      // NOTE: beforeinstallprompt only fires for THIS site (the store
      // itself) in a real browser — a listed third-party PWA can't be
      // silently installed from here due to the same-origin nature of
      // the install prompt. We use the store's own deferred prompt if
      // present (e.g. when this store is itself installable) and
      // otherwise fall back to opening the app so the user can install
      // it from its own origin, which is what real app stores that
      // list PWAs do in practice.
      if(state.deferredInstallPrompt){
        state.deferredInstallPrompt.prompt();
        const choice = await state.deferredInstallPrompt.userChoice;
        state.deferredInstallPrompt = null;
        if(choice.outcome === "accepted") showToast("Installed.");
        updateInstallBannerVisibility();
      } else {
        statusMsg.innerHTML = `<div style="font-family:var(--font-mono);font-size:12px;color:var(--text-faint);margin-top:10px;">Your browser didn't offer an install prompt for this app from here. Opening it directly — look for an "Install" icon in the address bar, or your browser's menu, once it loads.</div>`;
        window.open(app.appUrl, "_blank", "noopener,noreferrer");
      }
    });
  }

  // --- APK download-in-place handling ---
  if(app.type === "TWA"){
    bindApkDownloadButton(app);
  }
}

/* ----------------------------------------------------------------------
   APK DOWNLOAD-IN-PLACE
   Streams the .apk with fetch(), fills the button as a progress bar
   using real byte counts when the server sends Content-Length, saves
   the finished file via a Blob + temporary <a download>, then flips
   the button to "Install".

   IMPORTANT PLATFORM LIMIT: no web API can silently trigger Android's
   package installer — that's an OS permission gated behind the user
   tapping the downloaded file themselves (by design, so no website can
   silently install software). "Install" here re-opens the saved file
   with the browser's default handler, which on Android hands off to
   the package installer; we also show a one-line nudge in case the
   platform requires the extra tap on the download notification.
   ---------------------------------------------------------------------- */
function bindApkDownloadButton(app){
  const btn = document.getElementById("apk-download-btn");
  if(!btn) return;
  const fill = document.getElementById("apk-progress-fill");
  const label = document.getElementById("apk-progress-label");
  const statusMsg = document.getElementById("install-status-msg");
  let downloadedBlob = null;
  let downloadedFilename = btn.dataset.filename || "app.apk";

  function setState(newState){
    btn.dataset.state = newState;
  }
  function setProgress(pct){
    fill.style.width = `${Math.max(0, Math.min(100, pct))}%`;
  }
  function setLabel(html){
    label.innerHTML = html;
  }
  function triggerBrowserSave(blob, filename){
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Revoke slightly later so the click has time to hand off to the
    // browser's own download manager first.
    setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
  }

  async function startDownload(){
    setState("downloading");
    setProgress(0);
    setLabel(`${icon("download")} Downloading… 0%`);
    statusMsg.innerHTML = "";

    try{
      const res = await fetch(app.downloadUrl, { mode: "cors" });
      if(!res.ok) throw new Error(`Server responded ${res.status}`);

      const contentType = res.headers.get("content-type") || "";
      const looksLikeApk = /octet-stream|android\.package-archive|apk/i.test(contentType) || /\.apk(\?|$)/i.test(app.downloadUrl);
      if(!res.body || !looksLikeApk){
        // Not a direct, streamable APK file — most likely a Play Store
        // listing page or an HTML redirect page. We can't show download
        // progress for something that isn't actually a file response,
        // so fall back to the only honest behavior: open it normally.
        throw new Error("NOT_A_DIRECT_FILE");
      }

      const total = parseInt(res.headers.get("content-length") || "0", 10);
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;

      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        chunks.push(value);
        received += value.length;
        if(total > 0){
          const pct = Math.round((received / total) * 100);
          setProgress(pct);
          setLabel(`${icon("download")} Downloading… ${pct}%`);
        } else {
          // No Content-Length header — show bytes received instead of
          // a percentage, and keep a slow indeterminate-ish fill going.
          setProgress(Math.min(92, (received / (1024*1024)) * 12));
          setLabel(`${icon("download")} Downloading… ${(received/1024/1024).toFixed(1)} MB`);
        }
      }

      const blob = new Blob(chunks, { type: contentType || "application/vnd.android.package-archive" });
      downloadedBlob = blob;
      setProgress(100);
      setLabel(`${icon("download")} Downloading… 100%`);

      triggerBrowserSave(blob, downloadedFilename);

      setState("ready");
      setProgress(100);
      setLabel(`${icon("check")} Install`);
      statusMsg.innerHTML = `<div style="font-family:var(--font-mono);font-size:12px;color:var(--text-faint);margin-top:10px;">Saved to your downloads. Tap "Install" below, or open it from your notification shade / Downloads app to continue.</div>`;
      showToast("Download complete.");

    } catch(e){
      // Two cases fall back to just opening the link normally, rather
      // than showing a scary "download failed" state: (1) the response
      // wasn't actually a streamable file (NOT_A_DIRECT_FILE, thrown
      // above), and (2) a network-level failure before we got any
      // response at all — most commonly a cross-origin host that
      // doesn't send CORS headers for fetch(), which is common for
      // third-party download hosts. Neither means the file is broken;
      // it just means we can't show progress for it from here.
      const isNetworkLevelFailure = e instanceof TypeError;
      if(e.message === "NOT_A_DIRECT_FILE" || isNetworkLevelFailure){
        setState("idle");
        setProgress(0);
        setLabel(`${icon("download")} Download APK`);
        window.open(app.downloadUrl, "_blank", "noopener,noreferrer");
        return;
      }
      console.warn("[VAULT] APK download failed:", e.message);
      setState("error");
      setProgress(0);
      setLabel(`${icon("download")} Download failed — Retry`);
      statusMsg.innerHTML = `<div style="font-family:var(--font-mono);font-size:12px;color:var(--danger);margin-top:10px;">Download didn't complete (${escapeHtml(e.message)}). Tap to try again.</div>`;
    }
  }

  function triggerInstall(){
    // Browsers deliberately give web pages no API to invoke Android's
    // package installer directly — only the user tapping the actual
    // downloaded file can do that. Re-saving/re-opening the blob is the
    // closest equivalent: on most Android browsers this re-opens the
    // download, which hands off to the package installer the same way
    // tapping the download notification would.
    if(downloadedBlob){
      triggerBrowserSave(downloadedBlob, downloadedFilename);
      statusMsg.innerHTML = `<div style="font-family:var(--font-mono);font-size:12px;color:var(--text-faint);margin-top:10px;">If installation doesn't start automatically, open "${escapeHtml(downloadedFilename)}" from your notification shade or Downloads app.</div>`;
    }
  }

  btn.addEventListener("click", () => {
    const current = btn.dataset.state;
    if(current === "idle" || current === "error") startDownload();
    else if(current === "ready") triggerInstall();
    // "downloading" state: ignore repeat clicks while in flight.
  });
}


function bindContactEvents(){
  const form = document.getElementById("contact-form");
  if(!form) return;
  const fields = ["name","email","subject","message"];

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(fields.map(f => [f, form.querySelector(`#cf-${f}`).value]));
    const errors = validateContactForm(data);

    fields.forEach(f => {
      const group = document.getElementById(`fg-${f}`);
      const errEl = document.getElementById(`err-${f}`);
      if(errors[f]){ group.classList.add("has-error"); errEl.hidden = false; errEl.textContent = errors[f]; }
      else { group.classList.remove("has-error"); errEl.hidden = true; }
    });
    if(Object.keys(errors).length > 0) return;

    const submitBtn = document.getElementById("contact-submit-btn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";
    try{
      await submitContactForm(data);
      document.getElementById("contact-form-mount").innerHTML = renderContactSuccess();
      document.getElementById("contact-reset-btn").addEventListener("click", () => {
        document.getElementById("contact-form-mount").innerHTML = renderContactForm();
        bindContactEvents();
      });
      showToast("Message sent.");
    } catch(err){
      submitBtn.disabled = false;
      submitBtn.textContent = "Send message";
      showToast("Couldn't send your message: " + err.message, "error");
    }
  });
}

/* ====================================================================
   PWA — THE STORE ITSELF
   manifest.json, sw.js, and icons/*.png are now real files shipped
   alongside index.html (see the file list in the project root). This
   section wires them up and reflects any branding changes pulled from
   settings.json into the document's <title>/meta tags at runtime.
   ==================================================================== */

// Reflect settings.json branding (store name/tagline) into the document
// itself. Called once after loadConfiguration() resolves. The manifest
// and icon <link> tags themselves point at the static files below and
// don't need to change at runtime — only the visible title/meta do.
function applyManifestAndMeta(){
  document.title = STORE_CONFIG.name;
  const desc = document.querySelector('meta[name="description"]');
  if(desc) desc.setAttribute("content", `${STORE_CONFIG.tagline}.`);
}

// --- Service worker ---
// sw.js lives at the project root (see sw.js). It cannot be inlined
// into index.html — the Service Worker spec requires it to be
// registered from its own same-origin script file, since that file's
// URL doubles as its scope boundary. If sw.js is missing from the
// deployed origin, registration below just fails silently (caught)
// and the site continues to work normally online-only.
function registerServiceWorker(){
  if(!("serviceWorker" in navigator)) return;
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => {
      console.info("[VAULT] sw.js registration failed — offline support disabled:", e.message);
    });
  });
}

// Capture the store's own install prompt (for installing NullVault itself)
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  state.deferredInstallPrompt = e;
  updateInstallBannerVisibility();
});
window.addEventListener("appinstalled", () => {
  state.deferredInstallPrompt = null;
  showToast("NullVault installed to your device.");
});

/* ====================================================================
   BOOT
   Render the UI immediately with built-in fallback data first — the
   store must be visible with zero network dependencies, even offline
   or on a file:// preview. settings.json and app-list.json are then
   fetched in the background; once they resolve, a second render()
   picks up the real branding/catalog. A top-level catch ensures even
   a truly unexpected error can't leave a blank page silently.
   ==================================================================== */
function safeRender(){
  try {
    render();
  } catch (e) {
    console.error("[VAULT] Fatal render error:", e);
    root.innerHTML = `<div style="padding:60px 24px;text-align:center;font-family:monospace;color:#E8ECEF;">
      <h1 style="color:#FF5C7A;">Something broke on load</h1>
      <p style="color:#8B98A5;margin-top:10px;">${escapeHtml(e.message)}</p>
      <p style="color:#8B98A5;margin-top:10px;">Check the browser console for details.</p>
    </div>`;
  }
}

state.route = parseHash();
safeRender(); // instant paint using built-in fallback config/catalog

loadConfiguration().then(() => {
  applyManifestAndMeta(); // reflect any store-name/branding changes from settings.json
  safeRender();           // re-render with the real settings.json / app-list.json data
});

registerServiceWorker();
