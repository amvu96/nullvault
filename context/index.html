  $('#fp').onclick=()=>fp(false);setTimeout(()=>fp(true),400)}

  if(first){if(p.length<4)return err.textContent='Use at least 4 digits.';if(p!==$('#pin2').value)return err.textContent='PINs do not match.';
   const salt=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(p,salt);await kvSet('meta',{salt:b64(salt)});await save();}
  else{try{const k=await derive(p,ub(meta.salt));DB=await dec(await kvGet('data'),k);KEY=k;}catch{vib();return err.textContent='Wrong PIN.'}}
  startView();bump()};
 $('#go').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter'&&!first)go()};
}

function glyph(i,size=44){const n=12,f=Math.round((i/7)*n),r=size/2-5;let s='';

  s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${k<f?2.6:1.6}" fill="${k<f?'#ff1e1e':'#333'}"/>`}
 if(i===0)s=s.replace(/r="1.6"/g,'r="1"');return`<svg width="${size}" height="${size}">${s}</svg>`}

const sumPrompt=(es,l)=>`Summarize these journal entries (${l}). Give: key events, recurring themes, mood trend, people mentioned, and open loops worth acting on. Be concise.\n\n${es.map(e=>`[${e.d}] mood ${e.mood||'?'}/5, with ${jppl(e)}\n${e.title?e.title+'\n':''}${e.body}`).join('\n\n')}`;
async function runAI(pr,out,lab,onSave){const s=DB.settings;
 if(s.mode!=='direct'){out.innerHTML=`<h2>send to an llm</h2><pre>${esc(pr)}</pre>${geminiBtns()}<p class="hint">Pick Gemini in the share sheet and the text is prefilled. The prompt is also copied.</p>`;wireGem(out,pr);return}
 if(!s.apiKey){out.innerHTML='<p class="err">Add your Google AI Studio key in settings.</p>';return}
 out.innerHTML='<p class="hint">thinking&hellip;</p>';
 try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${s.model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':s.apiKey},body:JSON.stringify({contents:[{parts:[{text:pr}]}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);const t=j.candidates[0].content.parts.map(x=>x.text).join('');
  out.innerHTML=`<pre>${esc(t)}</pre><button class="btn r" id="sv">${lab}</button>`;out.querySelector('#sv').onclick=()=>onSave(t)}catch(e){out.innerHTML=`<p class="err">${esc(e.message)}</p>`}}
function vJournal(){DB.journal=DB.journal||[];
 const all=[...DB.journal].sort((a,b)=>b.d.localeCompare(a.d)||b.t-a.t),days=new Set(all.map(e=>e.d)),c=new Date();let st=0;if(!days.has(today()))c.setDate(c.getDate()-1);while(days.has(dfmt(c))){st++;c.setDate(c.getDate()-1)}
 const w7=new Date();w7.setDate(w7.getDate()-7);const cut=dfmt(w7),wk=all.filter(e=>e.d>cut).reduce((a,e)=>a+words(e.body),0);
 const L=all.filter(e=>(!JP||e.people.includes(JP))&&(JF!=='pin'||e.pin)&&(e.title+' '+e.body).toLowerCase().includes(JQ.toLowerCase())),grp={},jp=JP&&DB.people.find(p=>p.id===JP);
 L.forEach(e=>{const k=new Date(e.d+'T00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});(grp[k]=grp[k]||[]).push(e)});
 app.innerHTML=`<div class="lay"><div class="lcol"><div class="bar"><div class="logo">C</div><div class="t"><em>&gt;_</em> context <span>/ journal</span></div>${TOPR}</div>
 <div class="card"><div class="lab">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</div><div class="hi">${days.has(today())?'Written today. Nice.':'Anything on your mind?'}</div>
 <div class="stats"><div class="stt"><b>${all.length}</b><small>entries</small></div><div class="stt"><b>${st}</b><small>day streak</small></div><div class="stt"><b>${wk}</b><small>words / 7d</small></div></div>
 <div style="margin-top:16px"><button class="btn r" id="jn2">Write</button>${aiOn()&&all.length?'<button class="btn" id="jsum">Summarize 7 days</button>':''}${all.length?'<button class="btn" id="jex">Export</button>':''}</div></div><div id="jout"></div>
 <input id="jq" placeholder="search journal" value="${esc(JQ)}" style="margin-top:18px"><div class="chips scroll"><span class="chip ${JF==='all'?'on':''}" data-jf="all">All</span><span class="chip ${JF==='pin'?'on':''}" data-jf="pin">Pinned</span>${jp?`<span class="chip on" id="jpc">${esc(jp.name||'?')} <i class="fa-solid fa-xmark"></i></span>`:''}</div>
 <div class="jlist">${Object.entries(grp).map(([k,es])=>`<h2>${k}</h2>${es.map(e=>`<div class="je" data-id="${e.id}"><div style="display:flex;justify-content:space-between;gap:10px"><b style="font-weight:500">${e.pin?'<span style="color:var(--red)"><i class="fa-solid fa-star"></i></span> ':''}${esc(e.title||'Untitled')}</b>${moodDots(e.mood)}</div><small>${jdate(e.d)}${e.people.length?' &middot; '+esc(e.people.slice(0,3).map(i=>(DB.people.find(p=>p.id===i)||{}).name||'').filter(Boolean).join(', ')):''} &middot; ${words(e.body)} words</small><p>${esc(e.body)}</p></div>`).join('')}`).join('')||'<p class="hint" style="margin-top:30px">No entries yet. Tap Write.</p>'}</div></div><aside class="pane" id="jpane"></aside></div>`;
 wireTop();
 const nw=async()=>{const e={id:uid(),t:Date.now(),d:today(),title:'',body:'',mood:0,people:JP?[JP]:[],pin:false,ai:[]};DB.journal.push(e);await save();view={n:'entry',id:e.id};render()};$('#jn2').onclick=nw;
 $('#jq').oninput=e=>{JQ=e.target.value;const p=e.target.selectionStart;vJournal();const q=$('#jq');q.focus();q.setSelectionRange(p,p)};
 app.querySelectorAll('[data-jf]').forEach(c=>c.onclick=()=>{JF=c.dataset.jf;vJournal()});const jc=$('#jpc');if(jc)jc.onclick=()=>{JP=null;vJournal()};
 app.querySelectorAll('.je').forEach(c=>c.onclick=()=>{vib();showEntry(c.dataset.id)});
 const sm=$('#jsum');if(sm)sm.onclick=()=>{const es=all.filter(e=>e.d>cut).reverse();if(!es.length){$('#jout').innerHTML='<p class="hint">No entries in the last 7 days.</p>';return}
  runAI(sumPrompt(es,'last 7 days'),$('#jout'),'Save as entry',async t=>{DB.journal.push({id:uid(),t:Date.now(),d:today(),title:'Weekly summary',body:t,mood:0,people:[],pin:false,ai:[]});await save();vJournal()})};
 const ex=$('#jex');if(ex)ex.onclick=()=>{if(!confirm('This file is NOT encrypted. Continue?'))return;const md=[...DB.journal].sort((a,b)=>a.d.localeCompare(b.d)).map(e=>`## ${e.d}${e.title?' \u2014 '+e.title:''}\nMood: ${e.mood||'-'}/5\n\n${e.body}`).join('\n\n---\n\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='context-journal.md';a.click()};
 if(matchMedia('(min-width:1000px)').matches){const sx=JSEL&&(DB.journal||[]).find(x=>x.id===JSEL);if(sx)showEntry(JSEL);else $('#jpane').innerHTML=emptyPane('Select an entry')}
}
function showEntry(id){const e=(DB.journal||[]).find(x=>x.id===id);if(!e)return;closeCard();
 const pane=document.getElementById('jpane'),split=!!pane&&matchMedia('(min-width:1000px)').matches&&view.n==='journal',m=document.createElement('div');m.className='modal';m.id='card';const root=split?pane:m;
 const ppl=e.people.map(i=>DB.people.find(p=>p.id===i)).filter(Boolean);
 root.innerHTML=`<div class="mc"><button class="ib x" id="cx" aria-label="Close"><i class="fa-solid fa-xmark"></i></button><div class="lab">${jdate(e.d)}</div><h1 class="dot" style="font-size:24px;margin:8px 0;padding-right:40px">${esc(e.title||'Untitled')}</h1>
 <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${e.mood?moodDots(e.mood)+'<span class="hint">'+MOODS[e.mood]+'</span>':''}${e.pin?'<i class="fa-solid fa-star" style="color:var(--red)"></i>':''}<span class="hint">${words(e.body)} words</span></div>
 ${ppl.length?`<div class="chips" style="margin-top:14px">${ppl.map(p=>`<span class="chip" data-pp="${p.id}" style="cursor:pointer">${esc(p.name||'?')}</span>`).join('')}</div>`:''}
 <div style="white-space:pre-wrap;margin:18px 0;line-height:1.7;overflow-wrap:anywhere">${esc(e.body)||'<span class="hint">Empty entry</span>'}</div>
 ${(e.ai||[]).map(a=>`<h2>${a.k}</h2><pre>${esc(a.x)}</pre>`).join('')}
 <div class="acts"><button class="btn r" id="jed"><i class="fa-solid fa-pen"></i> Edit</button></div></div>`;
 if(!split){document.body.appendChild(m);m.onclick=x=>{if(x.target===m)closeCard()}}else{JSEL=id;document.querySelectorAll('.je').forEach(r=>r.classList.toggle('sel',r.dataset.id===id))}
 root.querySelector('#cx').onclick=closeCard;root.querySelector('#jed').onclick=()=>{JSEL=id;view={n:'entry',id};render()};
 root.querySelectorAll('[data-pp]').forEach(c=>c.onclick=()=>showCard(c.dataset.pp))}
function vEntry(){const e=(DB.journal||[]).find(x=>x.id===view.id);if(!e){view={n:'journal'};return render()}e.ai=e.ai||[];lastEntry=e.id;JSEL=e.id;
 app.innerHTML=`<div class="bar"><button class="ib" id="back" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button><div class="t"><em>&gt;_</em> entry</div><button class="ib" id="pin" aria-label="Pin" style="${e.pin?'color:var(--red);border-color:var(--red)':''}"><i class="fa-solid fa-star"></i></button><button class="ib" id="del" aria-label="Delete"><i class="fa-solid fa-trash"></i></button></div>
 <input type="date" id="jd" value="${e.d}"><label>Mood</label><div class="chips">${[1,2,3,4,5].map(i=>`<span class="chip ${e.mood===i?'on':''}" data-m="${i}">${MOODS[i]}</span>`).join('')}</div>
 <label>Title</label><input id="jt" value="${esc(e.title)}" placeholder="Optional"><div style="margin:16px 0 6px"><button class="btn" id="pr" style="margin:0">Prompt me</button> <span class="hint" id="pt"></span></div>
 <textarea id="jbody" style="min-height:42vh" placeholder="Write anything&hellip;">${esc(e.body)}</textarea><div class="hint" id="wc">${words(e.body)} words</div>
 <label>Who is this about?</label><input id="ps" placeholder="search people" style="margin-bottom:10px"><div class="chips" style="max-height:132px;overflow-y:auto">${DB.people.map(p=>`<span class="chip ${e.people.includes(p.id)?'on':''}" data-p="${p.id}" data-n="${esc((p.name+' '+(p.nick||'')).toLowerCase())}">${esc(p.nick||p.name||'?')}</span>`).join('')||'<span class="hint">No people yet</span>'}</div>
 ${aiOn()?`<h2>ai</h2><button class="btn r" id="adv">Get advice</button><button class="btn" id="sum">Summarize</button><p class="hint">Entry text is sent as written. People are aliased if that is on in settings.</p>`:''}<div id="aiout"></div>
 ${e.ai.map((a,i)=>`<h2>${a.k}</h2><pre>${esc(a.x)}</pre><button class="btn" data-ad="${i}">Remove</button>`).join('')}`;
 let tm;const ts=()=>{clearTimeout(tm);tm=setTimeout(save,400)};
 $('#jt').oninput=x=>{e.title=x.target.value;ts()};$('#jbody').oninput=x=>{e.body=x.target.value;$('#wc').textContent=words(e.body)+' words';ts()};
 $('#jd').onchange=x=>{if(x.target.value){e.d=x.target.value;ts()}};
 app.querySelectorAll('[data-m]').forEach(c=>c.onclick=()=>{const m=+c.dataset.m;e.mood=e.mood===m?0:m;app.querySelectorAll('[data-m]').forEach(z=>z.classList.toggle('on',+z.dataset.m===e.mood));ts()});
 app.querySelectorAll('[data-p]').forEach(c=>c.onclick=()=>{const i=c.dataset.p;e.people=e.people.includes(i)?e.people.filter(x=>x!==i):[...e.people,i];c.classList.toggle('on');ts()});
 app.querySelectorAll('[data-ad]').forEach(b=>b.onclick=async()=>{e.ai.splice(+b.dataset.ad,1);await save();vEntry()});
 $('#ps').oninput=x=>{const q=x.target.value.trim().toLowerCase();app.querySelectorAll('[data-p]').forEach(c=>{c.style.display=!q||c.classList.contains('on')||c.dataset.n.includes(q)?'':'none'})};
 let pi=Math.floor(Math.random()*PROMPTS.length);$('#pr').onclick=()=>{$('#pt').textContent=PROMPTS[pi++%PROMPTS.length]};
 $('#pin').onclick=async()=>{e.pin=!e.pin;await save();vEntry()};
 $('#del').onclick=async()=>{if(confirm('Delete this entry?')){DB.journal=DB.journal.filter(x=>x.id!==e.id);await save();view={n:'journal'};render()}};
 $('#back').onclick=async()=>{clearTimeout(tm);if(!e.title.trim()&&!e.body.trim()&&!e.ai.length)DB.journal=DB.journal.filter(x=>x.id!==e.id);await save();view={n:'journal'};render()};
 const go=(k,pr)=>runAI(pr,$('#aiout'),'Save to entry',async t=>{e.ai.push({k,x:t});await save();vEntry()});
 const a=$('#adv');if(a){a.onclick=()=>go('advice',advPrompt(e));$('#sum').onclick=()=>go('summary',sumPrompt([e],'one entry'))}}
/* ---------- bottom bar ---------- */
const TOPR='<button class="ib" id="st" aria-label="Settings"><i class="fa-solid fa-gear"></i></button><button class="ib" id="lk" aria-label="Lock"><i class="fa-solid fa-lock"></i></button>';
function wireTop(){const a=$('#st'),b=$('#lk');if(a)a.onclick=()=>{view={n:'settings'};render()};if(b)b.onclick=()=>lockScreen()}
async function newEntry(){DB.journal=DB.journal||[];const e={id:uid(),t:Date.now(),d:today(),title:'',body:'',mood:0,people:JP?[JP]:[],pin:false,ai:[]};DB.journal.push(e);await save();view={n:'entry',id:e.id};render()}
function updateNav(){const n=document.getElementById('nav');if(!n)return;n.style.display=view.n==='map'?'none':'';
 const A={list:'p',person:'p',mend:'p',cal:'c',journal:'j',entry:'j'}[view.n];n.querySelectorAll('[data-nv]').forEach(b=>b.classList.toggle('on',b.dataset.nv===A));
 n.querySelector('#add').setAttribute('aria-label',A==='j'?'New entry':'Add person')}
document.body.insertAdjacentHTML('beforeend','<nav class="nav" id="nav" style="display:none"><button class="ni" data-nv="p"><span class="g"><i class="fa-solid fa-users"></i></span>People</button><button class="ni" data-nv="c"><span class="g"><i class="fa-solid fa-cake-candles"></i></span>Birthdays</button><button class="cfab" id="add" aria-label="Add person"><i class="fa-solid fa-plus"></i></button><button class="ni" data-nv="m"><span class="g"><i class="fa-solid fa-diagram-project"></i></span>Map</button><button class="ni" data-nv="j"><span class="g"><i class="fa-solid fa-book-open"></i></span>Journal</button></nav>');
document.getElementById('nav').onclick=async e=>{const b=e.target.closest('button');if(!b)return;vib();
 if(b.id==='add'){if(view.n==='journal'||view.n==='entry')return newEntry();const p=blank();DB.people.push(p);await save();view={n:'person',id:p.id};return render()}
 const k=b.dataset.nv;if(k==='p')view={n:'list'};else if(k==='c'){const n=new Date();CAL={y:n.getFullYear(),m:n.getMonth(),sel:n.getDate()};view={n:'cal'}}else if(k==='m')view={n:'map'};else if(k==='j'){JP=null;view={n:'journal'}}render()};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script></body></html>
