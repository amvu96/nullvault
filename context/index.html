const uiPrompt=(msg,val,type)=>uiDialog({msg,input:1,value:val||'',type,buttons:[{t:'Cancel',v:null},{t:'OK',r:1,v:'__input'}]});
const askKey=msg=>uiDialog({msg,input:1,ph:'XXXX-XXXX-XXXX-XXXX-XXXX',buttons:[{t:'Cancel',v:null},{t:'Scan QR',keep:1,f:async m=>{try{const r=await scanQR();if(r)m.querySelector('#dlgi').value=r.trim()}catch(e){toast(e.message)}}},{t:'OK',r:1,v:'__input'}]});
const loadQR=()=>new Promise((res,rej)=>{if(window.qrcode)return res();const e=document.createElement('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';e.onload=res;e.onerror=()=>rej(new Error('Could not load the QR library. Are you offline?'));document.head.appendChild(e)});
async function showQR(m,k){const box=m.querySelector('#qrbox');if(box.innerHTML){box.innerHTML='';return}box.innerHTML='<span class="hint">loading&hellip;</span>';
 try{await loadQR();const q=qrcode(0,'M');q.addData(k);q.make();const n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+2} ${r+2}h1v1h-1z`;
  box.innerHTML=`<div style="background:#fff;padding:10px;border-radius:14px;display:inline-block;line-height:0"><svg viewBox="0 0 ${n+4} ${n+4}" width="220" height="220" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg></div><div class="hint" style="margin-top:8px">Anyone who scans this can read your key. Hide it when you are done.</div>`}catch(e){box.innerHTML=`<span class="err">${esc(e.message)}</span>`}}
async function scanQR(){if(!('BarcodeDetector' in window)||!navigator.mediaDevices)throw new Error('QR scanning is not supported in this browser. Type the key instead.');
 const det=new BarcodeDetector({formats:['qr_code']});let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch{throw new Error('Camera access was denied.')}
 return new Promise(async res=>{const m=document.createElement('div');m.className='modal';m.style.zIndex=110;m.style.alignItems='center';m.innerHTML='<div class="mc dlg"><div>Point the camera at the QR code</div><video playsinline muted style="width:100%;border-radius:16px;margin-top:12px;background:#000"></video><div class="acts"><button class="btn" id="qc">Cancel</button></div></div>';document.body.appendChild(m);
  const v=m.querySelector('video');v.srcObject=stream;try{await v.play()}catch{}let on=true;const end=r=>{on=false;stream.getTracks().forEach(t=>t.stop());m.remove();res(r)};m.querySelector('#qc').onclick=()=>end(null);
  const loop=async()=>{if(!on)return;try{const c=await det.detect(v);if(c.length)return end(c[0].rawValue)}catch{}setTimeout(loop,250)};loop()})}
async function showKey(k){try{navigator.clipboard.writeText(k)}catch{}
 return uiDialog({html:`<b>Your recovery key</b> (copied)<div style="font-size:17px;letter-spacing:.08em;margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:14px;text-align:center;user-select:all">${esc(k)}</div><div class="hint">Save it in a password manager. You need it to restore on a new device, and it cannot be recovered if lost.</div><div id="qrbox" style="margin-top:14px;text-align:center"></div>`,buttons:[{t:'<i class="fa-solid fa-qrcode"></i> QR code',keep:1,f:m=>showQR(m,k)},{t:'Done',r:1,v:true}]})}
/* ---------- google drive (encrypted backup in the private app folder) ---------- */
const gCid=()=>(GCLIENT||(typeof DB!=='undefined'&&DB.settings.gClient)||'').trim();
const genKey=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(20));return[0,1,2,3,4].map(i=>[...r.slice(i*4,i*4+4)].map(x=>A[x%A.length]).join('')).join('-')};
const GT={tok:null,exp:0,tm:null},GSC='https://www.googleapis.com/auth/drive.appdata',GFILE='context-backup.json',gOn=()=>!!GT.tok&&Date.now()<GT.exp;
const loadGIS=()=>new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const e=document.createElement('script');e.src='https://accounts.google.com/gsi/client';e.onload=res;e.onerror=()=>rej(new Error('Could not load Google sign-in. Are you offline?'));document.head.appendChild(e)});
async function driveConnect(){const id=gCid();if(!id)throw new Error('Google sign-in is not set up in this copy of the app yet.');await loadGIS();
 return new Promise((res,rej)=>google.accounts.oauth2.initTokenClient({client_id:id,scope:GSC,callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));GT.tok=r.access_token;GT.exp=Date.now()+(r.expires_in-60)*1000;res()},error_callback:e=>rej(new Error('Sign-in cancelled or blocked ('+(e.type||'error')+')'))}).requestAccessToken())}
const gf=async(u,o={})=>{const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+GT.tok,...(o.headers||{})}});if(!r.ok)throw new Error('Drive error '+r.status+(r.status===401?' (reconnect)':r.status===403?' (is the Drive API enabled?)':''));return r};
const gFind=async()=>(await(await gf('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q='+encodeURIComponent("name='"+GFILE+"'")+'&fields=files(id,modifiedTime)')).json()).files[0]||null;
async function driveBackup(auto){if(!gOn())throw new Error('Not connected');const pw=DB.settings.gPass||'';if(pw.length<8)throw new Error('Set a backup passphrase of 8+ characters.');
 const salt=crypto.getRandomValues(new Uint8Array(16)),k=await derive(pw,salt),body=JSON.stringify({v:1,app:'context',t:Date.now(),salt:b64(salt),...await enc(DB,k)}),f=await gFind();
 if(auto&&f&&!DB.settings.gLast)throw new Error('skip');
 if(f)await gf('https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});
 else{const bd='ctx'+Date.now();await gf('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:GFILE,parents:['appDataFolder']})}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`})}
 DB.settings.gLast=Date.now();if(KEY)await kvSet('data',await enc(DB,KEY))}
function driveSilent(){return loadGIS().then(()=>new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('timeout')),6000);
 google.accounts.oauth2.initTokenClient({client_id:gCid(),scope:GSC,callback:r=>{clearTimeout(t);if(r.error)return rej(new Error(r.error));GT.tok=r.access_token;GT.exp=Date.now()+(r.expires_in-60)*1000;res()},error_callback:()=>{clearTimeout(t);rej(new Error('no'))}}).requestAccessToken({prompt:'none'})}))}
async function driveRestore(){if(!gOn())throw new Error('Not connected');const f=await gFind();if(!f)throw new Error('No backup found on Drive.');
 const j=await(await gf('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media')).json(),keep={gClient:DB.settings.gClient,gPass:DB.settings.gPass};let d;
 try{d=await dec(j,await derive(keep.gPass||'',ub(j.salt)))}catch{throw new Error('Wrong passphrase for this backup.')}
 DB=d;DB.settings=Object.assign(DB.settings||{},keep,{gLast:Date.now()});await save()}
function gSched(){const s=typeof DB!=='undefined'&&DB&&DB.settings;if(!s||!s.gAuto||!gOn()||!KEY)return;clearTimeout(GT.tm);GT.tm=setTimeout(()=>driveBackup(true).catch(()=>{}),20000)}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
navigator.storage?.persist?.();
lockScreen();
